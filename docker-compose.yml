services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sams}
      POSTGRES_USER: ${POSTGRES_USER:-sams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sams}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SEED_DEMO: "1"
    volumes:
      - ./backend:/app
      - mediadata:/app/media
      - staticdata:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -
    ports:
      - "8000:8000"

  celery_worker:
    profiles: ["workers"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SKIP_DJANGO_STARTUP: "1"
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    command: celery -A config worker -l info

  celery_beat:
    profiles: ["workers"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SKIP_DJANGO_STARTUP: "1"
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    command: celery -A config beat -l info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "9000:9000"
    command: npx quasar dev --host 0.0.0.0 --port 9000

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - staticdata:/var/www/static:ro
      - mediadata:/var/www/media:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  mediadata:
  staticdata:
