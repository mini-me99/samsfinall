# Production overrides. Use: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  backend:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: 0
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --access-logfile -
    restart: unless-stopped

  celery_worker:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    restart: unless-stopped

  celery_beat:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    restart: unless-stopped

  frontend:
    command: sh -c "npx quasar build && npx http-server dist/spa -p 9000 -a 0.0.0.0 --proxy http://localhost:9000?"
    restart: unless-stopped

  nginx:
    restart: unless-stopped

  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped
